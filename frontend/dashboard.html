<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>仪表盘 · PPC 平台</title>
  <link rel="stylesheet" href="/workflow.css">
  <script src="/plan-link.js"></script>
  <script src="/point-cost.js"></script>
  <script src="/reading.js"></script>
  <script src="/dashboard.js" defer></script>
</head>
<body>
<header class="topbar"><a class="brand" href="/dashboard.html">PPC <span>平台</span></a><a href="/workflow.html">广告工作台</a><a href="/points.html">积分</a><a href="/login.html" id="logout">退出</a></header>
<main>
  <section class="panel">
    <p class="eyebrow">登录后的主页</p>
    <h1 id="welcome">仪表盘</h1>
    <p id="account" class="muted">正在读取账号…</p>
    <p id="recharge-notice" class="callout">正在读取充值状态…</p>
    <div class="action-cards">
      <a class="action-card primary-card" href="/workflow.html">
        <b>开始新方案</b><small>上传搜索词报告，生成可审核的优化动作</small>
      </a>
      <a class="action-card" href="/workflow.html" id="continue-card">
        <b>继续最近的方案</b><small id="continue-note">从上次进度接着审核</small>
      </a>
      <a class="action-card" href="/workflow.html?demo=1">
        <b>载入示例</b><small>不导报表，先看完整调用过程</small>
      </a>
    </div>
    <div id="summary" class="metrics"></div>
  </section>
  <section class="panel">
    <h2>最近方案</h2>
    <p id="plans-conclusion" class="callout"></p>
    <div id="plans"><p class="muted">正在加载…</p></div>
  </section>
</main>
</body>
</html>
