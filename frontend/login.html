<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 广告优化工作台</title>
  <link rel="stylesheet" href="/workflow.css">
  <script src="/login.js" defer></script>
</head>
<body>
<main class="layout">
  <section class="panel">
    <p class="eyebrow">账号</p>
    <h1>登录广告优化工作台</h1>
    <p class="muted">这是本工具的账号，不是亚马逊账号。登录后只能看到自己的方案。系统不会自动修改广告后台。</p>
    <form id="login-form">
      <div class="form-grid">
        <label>邮箱<input name="email" type="email" required autocomplete="username"></label>
        <label>密码<input name="password" type="password" required minlength="8" autocomplete="current-password"></label>
      </div>
      <button class="primary" type="submit">登录</button>
      <button type="button" id="register">注册并进入</button>
    </form>
    <p id="login-status" role="status"></p>
  </section>
</main>
</body>
</html>
