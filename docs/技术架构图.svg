ont-weight="700" fill="#163655">接入与上下文</text><text x="66.0" y="324" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#53697e">CSV / TSV 类型区分</text><text x="66.0" y="348" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#53697e">账户、站点、币种、ASIN 隔离</text><rect x="610.0" y="260" width="545.0" height="108" rx="12" fill="white" stroke="#b9cde3"/><rect x="610.0" y="260" width="6" height="108" rx="3" fill="#13847c"/><text x="631.0" y="295" font-size="21" font-family="Microsoft YaHei, sans-serif" font-weight="700" fill="#163655">事实与实体</text><text x="631.0" y="324" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#53697e">搜索词 → 绩效事实</text><text x="631.0" y="348" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#53697e">Bulk → 真实 Bid、父 ID、Keyword ID</text><path d="M600 371 L600 398" stroke="#5f7b9e" stroke-width="2" marker-end="url(#arrow)"/><rect x="45.0" y="405" width="545.0" height="108" rx="12" fill="white" stroke="#b9cde3"/><rect x="45.0" y="405" width="6" height="108" rx="3" fill="#13847c"/><text x="66.0" y="440" font-size="21" font-family="Microsoft YaHei, sans-serif" font-weight="700" fill="#163655">规则与方案服务</text><text x="66.0" y="469" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#53697e">复用七级分级 / 明确动作范围</text><text x="66.0" y="493" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#53697e">证据、优先级、预算参考</text><rect x="610.0" y="405" width="545.0" height="108" rx="12" fill="white" stroke="#b9cde3"/><rect x="610.0" y="405" width="6" height="108" rx="3" fill="#13847c"/><text x="631.0" y="440" font-size="21" font-family="Microsoft YaHei, sans-serif" font-weight="700" fill="#163655">执行门禁</text><text x="631.0" y="469" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#53697e">审核状态 / 实体 / Bid / 冲突</text><text x="631.0" y="493" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#53697e">不允许客户端绕过</text><path d="M600 516 L600 543" stroke="#5f7b9e" stroke-width="2" marker